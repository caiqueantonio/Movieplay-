<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Chrome Ring Gradients -->
    <linearGradient id="chromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="75%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="chromeInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="40%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <!-- Crimson Ruby Radial Gradient -->
    <radialGradient id="rubyRed" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#580d0d"/>
    </radialGradient>

    <!-- Gem Facet Gradient -->
    <linearGradient id="gemFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="metalText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f3f4f6"/>
      <stop offset="52%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Drop Shadow behind entire badge -->
  <circle cx="256" cy="256" r="236" fill="#000000" opacity="0.35" filter="url(#dropShadow)"/>

  <!-- Outer Chrome Rim 1 -->
  <circle cx="256" cy="256" r="236" fill="url(#chromeOuter)"/>
  <!-- Chrome Rim 2 (groove) -->
  <circle cx="256" cy="256" r="226" fill="#1f2937"/>
  <!-- Chrome Rim 3 (inner shiny ring) -->
  <circle cx="256" cy="256" r="220" fill="url(#chromeInner)"/>
  <circle cx="256" cy="256" r="212" fill="#3f0808"/>

  <!-- Ruby Red Core Circle -->
  <circle cx="256" cy="256" r="208" fill="url(#rubyRed)"/>

  <!-- Top Glass Highlight Reflection -->
  <path d="M 70 200 A 208 208 0 0 1 442 200 A 214 130 0 0 0 70 200 Z" fill="#ffffff" opacity="0.18" />

  <!-- Filmstrip Behind Play Button -->
  <g transform="translate(142, 140) rotate(-10)" filter="url(#dropShadow)">
    <rect x="-10" y="24" width="220" height="92" rx="10" fill="#ffffff" opacity="0.95"/>
    <!-- Filmstrip sprocket holes (top and bottom) -->
    <rect x="0" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="24" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="48" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="72" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="96" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="120" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="144" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="168" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="192" y="28" width="16" height="14" rx="2" fill="#7f1d1d"/>

    <rect x="0" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="24" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="48" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="72" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="96" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="120" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="144" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="168" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
    <rect x="192" y="98" width="16" height="14" rx="2" fill="#7f1d1d"/>
  </g>

  <!-- 3D Play Button Triangle -->
  <g filter="url(#dropShadow)">
    <!-- White outer bevel triangle -->
    <path d="M 210 148 C 200 142 186 150 186 164 L 186 288 C 186 302 200 310 210 304 L 314 242 C 324 236 324 220 314 214 Z"
          fill="#ffffff" stroke="#e2e8f0" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner ruby faceted gem play triangle -->
    <path d="M 218 178 C 214 175 208 178 208 184 L 208 268 C 208 274 214 277 218 274 L 284 232 C 288 230 288 222 284 220 Z"
          fill="url(#gemFacet)"/>
    
    <!-- Facet cut highlights -->
    <polygon points="208,184 246,226 218,178" fill="#ffffff" opacity="0.45"/>
    <polygon points="208,268 246,226 218,274" fill="#580d0d" opacity="0.6"/>
    <polygon points="284,226 246,226 218,178" fill="#ff9999" opacity="0.35"/>
  </g>

  <!-- Chrome 3D Movieplay Typography -->
  <!-- Shadow text -->
  <text x="256" y="380"
        text-anchor="middle"
        font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif"
        font-size="70"
        font-weight="900"
        font-style="italic"
        letter-spacing="-1"
        fill="#111827"
        opacity="0.8">
    Movieplay
  </text>
  <!-- Main Chrome Text with Stroke -->
  <text x="256" y="376"
        text-anchor="middle"
        font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif"
        font-size="70"
        font-weight="900"
        font-style="italic"
        letter-spacing="-1"
        stroke="#475569"
        stroke-width="5"
        stroke-linejoin="round"
        fill="url(#metalText)"
        filter="url(#dropShadow)">
    Movieplay
  </text>
  <!-- Top Specular Highlight on text -->
  <text x="256" y="374"
        text-anchor="middle"
        font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif"
        font-size="70"
        font-weight="900"
        font-style="italic"
        letter-spacing="-1"
        fill="#ffffff"
        opacity="0.4">
    Movieplay
  </text>
</svg>
